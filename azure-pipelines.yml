trigger:
- master

pool:
  vmImage: windows-latest
variables:
  BuildConfiguration: Release
steps:
- task: UseDotNet@2
  inputs:
      packageType: 'sdk'
      version: '9.0.x'
- task: NuGetAuthenticate@1
- task: DotNetCoreCLI@2
  displayName: Restore NuGet packages
  inputs:
    command: restore
    projects: |
      **/*.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Build the libraries
  inputs:
    projects: |
      **/*.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: test
    projects: |
      **/*.Tests.csproj
    arguments: '--configuration $(BuildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: Push NuGet packages
  inputs:
    command: 'custom'
    custom: 'nuget'
    arguments: 'push -k AzureArtifacts --source $(packagefeed) --skip-duplicate **/Release/*.nupkg'